<style>
/* Layout: toolbar across the top, feature tree left, four linked viewports centre, properties right. Dark graphite first. */
:root{

  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#141519; --panel:#1c1e23; --panel-2:#22252b; --line:#30333b; --ink:#ecebe8; --ink-2:#a9a7a2; --ink-3:#73726f; --accent:#ff7b3d; --accent-ink:#1a1206; --ai:#3fd0bf; --cool:#7aa2ff; --warn:#ff6b5e; --ok:#5ad08c; --hover:#ffffff10; --sel:#ff7b3d26; color-scheme: dark; } }
:root[data-theme="dark"]{ --bg:#141519; --panel:#1c1e23; --panel-2:#22252b; --line:#30333b; --ink:#ecebe8; --ink-2:#a9a7a2; --ink-3:#73726f; --accent:#ff7b3d; --accent-ink:#1a1206; --ai:#3fd0bf; --cool:#7aa2ff; --warn:#ff6b5e; --ok:#5ad08c; --hover:#ffffff10; --sel:#ff7b3d26; color-scheme: dark; }
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:500 13px/1.35 var(--f-ui);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:240px 1fr 280px;grid-template-rows:auto 1fr;height:100%}
#bar{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:8px max(10px, env(safe-area-inset-right,0px)) 8px max(10px, env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;row-gap:6px}
#bar::-webkit-scrollbar{display:none}

.brand i{width:12px;height:12px;border-radius:3px;background:var(--accent);transform:rotate(12deg) skewX(-8deg);display:block;box-shadow:3px 3px 0 var(--ai)}
.grp{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);flex:none}
.grp .lbl{font:700 9.5px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);align-self:center;padding:0 5px}
.tb{border:0;background:transparent;border-radius:8px;padding:7px 9px;cursor:pointer;font:600 12.5px/1 var(--f-ui);display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}

.tb:hover{background:var(--hover)} .tb.on{background:var(--accent);color:var(--accent-ink)} .tb[disabled]{opacity:.35;pointer-events:none}

#name:focus{outline:2px solid var(--accent);background:var(--panel)}

#tree{border-right:1px solid var(--line)} #props{border-left:1px solid var(--line)}

.row:hover{background:var(--hover)} .row.on{background:var(--sel);border-left-color:var(--accent)}
.row .ic{width:20px;height:20px;display:grid;place-items:center;color:var(--ink-2)} .row .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row .sub{font:500 10.5px/1.2 var(--f-mono);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.tool{padding-left:28px} .row.tool .nm{font-weight:500}

.sec{padding:4px 14px 12px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--line)}
.sec h4{margin:8px 0 2px;font:700 10px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.f{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}

.f textarea{min-height:70px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 10px;cursor:pointer;font:600 12px var(--f-ui);color:var(--ink)}
.btn:hover{border-color:var(--accent)} .btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .btn.danger:hover{border-color:var(--warn);color:var(--warn)}
.mono{font:500 11.5px/1.35 var(--f-mono);color:var(--ink)} .ok{color:var(--ok);font-weight:600} .warnline{color:var(--warn);font-size:12px;font-weight:600;line-height:1.4}

.empty{padding:16px;color:var(--ink-3);font-size:12.5px;line-height:1.5}
#dimEd{position:absolute;z-index:8;width:90px;font:600 13px var(--f-mono);border:2px solid var(--accent);border-radius:8px;padding:4px 7px;background:var(--panel);color:var(--ink)}

.pin{display:flex;align-items:center;gap:4px;min-width:0;flex-wrap:wrap} .pin input{flex:1;min-width:0}

.note{font-size:11.5px;line-height:1.45;color:var(--ink-3)}
.varadd{display:grid;grid-template-columns:1fr 1fr auto;gap:6px} .varadd input{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 7px;font:500 12px var(--f-mono);min-width:0}
#motion{position:absolute;left:12px;right:12px;bottom:12px;max-height:42%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px #0000003a;z-index:7;display:flex;flex-direction:column;gap:6px}

#cfgSel{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:8px;padding:5px 8px;font:600 12px var(--f-ui)}
.tblwrap{overflow-x:auto} table.cfg{border-collapse:collapse;font-size:12px;width:100%} table.cfg th{font:700 10px var(--f-ui);color:var(--ink-3);text-align:left;padding:2px 4px} table.cfg td{padding:2px 3px} table.cfg tr.on td{background:var(--sel)}

#hint input.vname{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 12px var(--f-ui);min-width:200px}
.sheetov{position:fixed;inset:0;background:#0008;z-index:40;display:grid;place-items:center;padding:20px}
.sheetbox{background:var(--panel);border-radius:12px;max-width:96vw;max-height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px #0007}
.sheetbar{display:flex;gap:8px;align-items:center;padding:10px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line)} .sheetimg{overflow:auto;background:#fff} .sheetimg img{display:block;width:min(1400px,92vw);height:auto}
table.sk td{vertical-align:middle} table.sk tr.bad td,.f.bad{background:color-mix(in srgb, var(--warn) 16%, transparent)} .relrow{display:flex;gap:4px;align-items:center;flex-wrap:wrap} .relrow select{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font:500 12px var(--f-ui)}
#check{position:absolute;right:12px;top:64px;width:min(360px,calc(100% - 24px));max-height:60%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px #0000003a;z-index:7;display:flex;flex-direction:column;gap:6px}
#check .mhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap} #check .mhead b{font:700 13px var(--f-brand)}
#check .clash{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 9px;cursor:pointer;font:600 12px var(--f-ui);color:var(--ink);text-align:left} #check .clash:hover{border-color:#ff3b3b}
.row.off{opacity:.45} .row.sup .nm{text-decoration:line-through} .row .more{border:0;background:transparent;color:var(--ink-3);font:700 14px/1 var(--f-ui);padding:2px 5px;border-radius:6px;cursor:pointer;opacity:.0} .row:hover .more,.row.on .more{opacity:1} .row .more:hover{background:var(--hover);color:var(--ink)}
@media (hover:none){ .row .more{opacity:1} }
.row.dropbefore{box-shadow:inset 0 2px 0 var(--accent)} .row.dropafter{box-shadow:inset 0 -2px 0 var(--accent)}
.rollbar{display:flex;align-items:center;gap:6px;margin:2px 10px;padding:3px 8px;border-top:3px solid var(--cool);font:700 10px/1.2 var(--f-ui);letter-spacing:.04em;color:var(--cool);cursor:grab;user-select:none}
#banner{position:absolute;bottom:12px;left:12px;background:var(--panel);border:1px solid var(--cool);color:var(--ink);border-radius:10px;padding:6px 8px 6px 12px;font:600 12.5px var(--f-ui);display:flex;gap:10px;align-items:center;z-index:6;box-shadow:0 6px 20px #0000002a}
#banner button{border:0;border-radius:7px;padding:5px 9px;background:var(--cool);color:#fff;font:700 12px var(--f-ui);cursor:pointer}
.menu button[disabled]{opacity:.4;pointer-events:none}
.seg{display:flex;gap:2px;margin:0 10px 6px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2)} .seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:5px;font:600 11.5px var(--f-ui);color:var(--ink-2);cursor:pointer} .seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px #0000002a}

.abtn:hover{border-color:var(--accent)} .abtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

<div id="app">
  <header id="bar">
    <div class="brand"><i></i>SketchFlow 3D</div>
    <input id="name" value="Model" aria-label="Model name" spellcheck="false">
    <select id="cfgSel" hidden title="Configuration (size variant)" aria-label="Configuration"></select>
    <div class="grp"><button class="tb" id="fileBtn" title="New, open, save, export, drawings, versions, import" data-icon="file">File ▾</button></div>
    <span class="chip" id="aiChip"><i></i><span>AI off</span></span>
    <div class="grp"><span class="lbl">Add</span>
      <button class="tb" data-add="box" title="Box (B)" data-icon="box">Box</button>
      <button class="tb" data-add="wedge" title="Wedge / triangle prism (W)" data-icon="wedge">Wedge</button>
      <button class="tb" data-add="cylinder" title="Cylinder (C)" data-icon="cylinder">Cyl</button>
      <button class="tb" data-add="cone" title="Cone (K)" data-icon="cone">Cone</button>
      <button class="tb" data-add="sphere" title="Sphere (O)" data-icon="sphere">Sphere</button>
      <button class="tb" data-add="fillet" title="Fillet strip: a separate triangular piece with an arc face, to place by hand (to round an edge, use Fillet under Features)" data-icon="fillet">Strip</button>
    </div>
    <div class="grp"><span class="lbl">Sketch</span>
      <button class="tb" data-tool="sketch" title="Sketch an outline — lines, arcs, rectangles, circles, slots, polygons — in FRONT, TOP or RIGHT, with snapping; then extrude, revolve or loft it (S)" data-icon="sketch">Sketch</button>
      <button class="tb" data-tool="sketch-face" title="Sketch on a flat face of a part: the outline starts on that face, then joins it or cuts into it, and follows it" data-icon="face">On face</button>
    </div>
    <div class="grp"><span class="lbl">Relate</span>
      <button class="tb" data-tool="mate" title="Mate: connector to connector (M)" data-icon="mate">Mate</button>
      <button class="tb" data-tool="bool-add" title="Union: click the target, then the tool" data-icon="union">Union</button>
      <button class="tb" data-tool="bool-subtract" title="Subtract: click the target, then the tool" data-icon="subtract">Subtract</button>
      <button class="tb" data-tool="bool-intersect" title="Intersect: click the target, then the tool" data-icon="intersect">Intersect</button>
    </div>
